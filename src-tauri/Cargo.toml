[package]
name = "notely"
version = "0.1.0"
description = "Gestor de notas Markdown para el menu bar de macOS"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Sin la feature macos-private-api: la Mac App Store rechaza apps que usan
# APIs privadas. La transparencia y las esquinas redondeadas se logran con
# APIs públicas de AppKit vía tauri-nspanel (vendorizado).
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { path = "vendor/tauri-nspanel" }

[profile.release]
codegen-units = 1
lto = true
strip = true
